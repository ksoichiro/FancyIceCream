plugins {
    // fabric-loom / dev.architectury.loom version is declared in settings.gradle
    // net.minecraftforge.gradle version is declared in settings.gradle (conditional on MC version)
    id 'net.neoforged.moddev' version "${moddevgradle_version}" apply false
    id 'net.neoforged.moddev.legacyforge' version "${moddevgradle_version}" apply false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'

    java {
        if ((java_version as int) >= 9) {
            toolchain {
                languageVersion = JavaLanguageVersion.of(java_version as int)
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = java_version as int
        options.compilerArgs += ['-Xlint:deprecation']
    }

    repositories {
        maven {
            name = 'Minecraft libraries'
            url = 'https://libraries.minecraft.net'
            content {
                includeModule("org.lwjgl", "lwjgl-freetype")
            }
        }
        mavenCentral()
    }

    afterEvaluate {
        if (!project.name.endsWith('-base') && project.name != 'common') {
            base {
                archivesName = "${mod_id}-${mod_version}+${minecraft_version}-${project.name}"
            }
        }
    }
}

apply from: 'gradle/multi-version-tasks.gradle'

// Production run support (Fabric, NeoForge)
// Applied via gradle.afterProject to ensure version-specific properties
// (injected by settings.gradle beforeProject) are available.
gradle.afterProject { proj ->
    if (proj.name in ['fabric', 'neoforge'] && proj.hasProperty('minecraft_version')) {
        // prod-run.gradle accesses properties via project.ext, but
        // settings.gradle's beforeProject may not populate ext in all
        // Gradle versions. Copy needed properties to ext if missing.
        ['minecraft_version', 'fabric_loader_version', 'fabric_api_version',
         'neoforge_version', 'java_version'].each { key ->
            if (!proj.ext.has(key) && proj.hasProperty(key)) {
                proj.ext.set(key, proj.findProperty(key))
            }
        }
        proj.apply from: rootProject.file('gradle/shared/prod-run.gradle')
        if (proj.name == 'fabric') {
            proj.dependencies {
                prodMods "net.fabricmc.fabric-api:fabric-api:${proj.fabric_api_version}"
            }
        }
    }
}
