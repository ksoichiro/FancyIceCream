plugins {
    id 'net.minecraftforge.gradle'
}

def forgeMajor = forge_major_version as int

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        register('client') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            if (System.getProperty('os.name').toLowerCase().contains('mac')) {
                jvmArgs '-XstartOnFirstThread'
            }
        }

        register('server') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        register('gameTestServer') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')
            args '--mod', mod_id, '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${forge_version}")
}

// Include common-shared source in compilation, but only if the forge module
// doesn't already contain those files
def commonSharedDir = rootProject.file('common/shared/src/main/java')
if (commonSharedDir.exists()) {
    def forgeJavaDir = file('src/main/java')
    def overlap = forgeJavaDir.exists() &&
        fileTree(commonSharedDir).files.any { f ->
            def rel = commonSharedDir.toPath().relativize(f.toPath()).toString()
            new File(forgeJavaDir, rel).exists()
        }
    if (!overlap) {
        sourceSets.main {
            java {
                srcDir commonSharedDir
            }
        }
    }
}

// Include generated resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.named('processResources') {
    filesMatching('META-INF/mods.toml') {
        expand(
            version: mod_version,
            minecraft_version: minecraft_version,
            forge_version: forge_version,
        )
    }
}

// Copy generated resources into build output after runData completes.
jar.dependsOn 'runData'
jar.doFirst {
    copy {
        from 'src/generated/resources'
        into sourceSets.main.output.resourcesDir
        exclude '.cache/**'
    }
}

// Pre-1.19 (Forge < 41): LWJGL 3.2.x lacks Apple Silicon (macOS arm64) natives.
// Override to LWJGL 3.3.4 and extract arm64 natives, then set org.lwjgl.librarypath
// so LWJGL loads arm64 dylibs instead of the x64 ones bundled with Forge.
if (forgeMajor < 41 && System.getProperty('os.arch') == 'aarch64') {
    def lwjglVersion = '3.3.4'
    def lwjglNatives = 'natives-macos-arm64'
    def lwjglModules = ['lwjgl', 'lwjgl-jemalloc', 'lwjgl-openal', 'lwjgl-opengl', 'lwjgl-glfw', 'lwjgl-stb', 'lwjgl-tinyfd']

    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.lwjgl') {
                details.useVersion lwjglVersion
            }
        }
    }

    configurations {
        lwjglArm64
    }

    dependencies {
        lwjglModules.each { mod ->
            lwjglArm64 "org.lwjgl:${mod}:${lwjglVersion}:${lwjglNatives}"
        }
    }

    def lwjglNativesDir = layout.buildDirectory.dir('lwjgl-arm64-natives').get().asFile

    task extractLwjglArm64Natives(type: Copy) {
        from { configurations.lwjglArm64.collect { zipTree(it) } }
        into lwjglNativesDir
        include '**/*.dylib'
        eachFile { it.path = it.name }
        includeEmptyDirs = false
    }

    minecraft {
        runs {
            configureEach {
                systemProperty 'org.lwjgl.librarypath', lwjglNativesDir.absolutePath
            }
        }
    }

    afterEvaluate {
        tasks.matching { it.name.startsWith('run') }.configureEach {
            dependsOn 'extractLwjglArm64Natives'
        }
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_id,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : mod_version,
                "Implementation-Vendor"   : mod_id,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${rootProject.projectDir}/mcmodsrepo"
        }
    }
}

clean {
    delete 'src/generated'
    delete 'run-data'
}
