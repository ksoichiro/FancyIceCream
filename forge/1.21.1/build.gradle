plugins {
    id 'net.minecraftforge.gradle'
}

def forgeMajor = forge_major_version as int

def atFile = file('src/main/resources/META-INF/accesstransformer.cfg')

minecraft {
    if (atFile.exists()) {
        accessTransformers.from(atFile)
    }

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            // 1.21.6+ (Forge 56+): EventBus strict runtime checks
            if (forgeMajor >= 56) {
                systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            }
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        register('client') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            if (System.getProperty('os.name').toLowerCase().contains('mac')) {
                jvmArgs '-XstartOnFirstThread'
            }
        }

        register('server') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        register('gameTestServer') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')
            args '--mod', mod_id, '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
            def commonResDir = rootProject.file("common/${minecraft_version}/src/main/resources")
            if (commonResDir.exists()) {
                args '--existing', commonResDir.absolutePath
            }
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${forge_version}") {
        if (atFile.exists()) {
            setAccessTransformer(true)
        }
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'

    // Forge 1.21.6+ (Forge 56+): EventBus 7 compile-time validation
    if (forgeMajor >= 56) {
        annotationProcessor 'net.minecraftforge:eventbus-validator:7.0-beta.10'
    }

    if (findProject(':common') != null) {
        compileOnly project(':common')

        commonJava project(path: ':common', configuration: 'commonJava')
        commonResources project(path: ':common', configuration: 'commonResources')
    }
}

// Include common-shared source in compilation, but only if neither the version-specific
// common module nor the forge module already contain those files
def commonSharedDir = rootProject.file('common/shared/src/main/java')
if (commonSharedDir.exists()) {
    def commonVersionJava = rootProject.file("common/${minecraft_version}/src/main/java")
    def forgeJavaDir = file('src/main/java')
    def overlap = fileTree(commonSharedDir).files.any { f ->
        def rel = commonSharedDir.toPath().relativize(f.toPath()).toString()
        (commonVersionJava.exists() && new File(commonVersionJava, rel).exists()) ||
        (forgeJavaDir.exists() && new File(forgeJavaDir, rel).exists())
    }
    if (!overlap) {
        sourceSets.main {
            java {
                srcDir commonSharedDir
            }
        }
    }
}

if (findProject(':common') != null) {
    // Check if forge module has overlapping sources with common module
    // (older versions like 1.21.1 have all sources in forge/ AND common/)
    def forgeJava = file('src/main/java')
    def commonVersionJava = rootProject.file("common/${minecraft_version}/src/main/java")
    def forgeCommonOverlap = forgeJava.exists() && commonVersionJava.exists() &&
        fileTree(commonVersionJava).files.any { f ->
            def rel = commonVersionJava.toPath().relativize(f.toPath()).toString()
            new File(forgeJava, rel).exists()
        }

    if (!forgeCommonOverlap) {
        tasks.named('compileJava') {
            dependsOn configurations.commonJava
            source configurations.commonJava
        }
    }

    tasks.named('processResources') {
        dependsOn configurations.commonResources
        from(configurations.commonResources)
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

tasks.named('processResources') {
    filesMatching('META-INF/mods.toml') {
        expand(
            version: mod_version,
            minecraft_version: minecraft_version,
            forge_version: forge_version,
        )
    }
}

// Merge resources and classes into the same directory for proper module support
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

// Copy generated resources to the build output directory
// NOTE: Explicit copy task needed because sourceSets.each overrides standard resource directory settings
task copyGeneratedResources(type: Copy) {
    from 'src/generated/resources'
    into sourceSets.main.output.resourcesDir
    exclude '.cache/**'
    dependsOn 'runData'
}

afterEvaluate {
    tasks.matching { it.name.startsWith('run') && it.name != 'runData' }.configureEach {
        dependsOn 'copyGeneratedResources'
    }
    jar.dependsOn 'copyGeneratedResources'
    compileTestJava.dependsOn 'copyGeneratedResources'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_id,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : mod_version,
                "Implementation-Vendor"   : mod_id,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${rootProject.projectDir}/mcmodsrepo"
        }
    }
}

clean {
    delete 'src/generated'
    delete 'run-data'
}
