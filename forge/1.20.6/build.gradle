plugins {
    id 'net.minecraftforge.gradle'
}

def forgeMajor = forge_major_version as int

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        register('client') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            if (System.getProperty('os.name').toLowerCase().contains('mac')) {
                jvmArgs '-XstartOnFirstThread'
            }
        }

        register('server') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        register('gameTestServer') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')
            args '--mod', mod_id, '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${forge_version}")
}

// Include common-shared source in compilation, but only if the forge module
// doesn't already contain those files
def commonSharedDir = rootProject.file('common/shared/src/main/java')
if (commonSharedDir.exists()) {
    def forgeJavaDir = file('src/main/java')
    def overlap = forgeJavaDir.exists() &&
        fileTree(commonSharedDir).files.any { f ->
            def rel = commonSharedDir.toPath().relativize(f.toPath()).toString()
            new File(forgeJavaDir, rel).exists()
        }
    if (!overlap) {
        sourceSets.main {
            java {
                srcDir commonSharedDir
            }
        }
    }
}

// Include generated resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Merge resources and classes into the same directory for proper module support
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

tasks.named('processResources') {
    filesMatching('META-INF/mods.toml') {
        expand(
            version: mod_version,
            minecraft_version: minecraft_version,
            forge_version: forge_version,
        )
    }
}

// Copy generated resources to the build output directory
task copyGeneratedResources(type: Copy) {
    from 'src/generated/resources'
    into sourceSets.main.output.resourcesDir
    exclude '.cache/**'
    dependsOn 'runData'
}

afterEvaluate {
    tasks.matching { it.name.startsWith('run') && it.name != 'runData' }.configureEach {
        dependsOn 'copyGeneratedResources'
    }
    jar.dependsOn 'copyGeneratedResources'
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_id,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : mod_version,
                "Implementation-Vendor"   : mod_id,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${rootProject.projectDir}/mcmodsrepo"
        }
    }
}

clean {
    delete 'src/generated'
    delete 'run-data'
}
